# Builds, signs, and publishes the release APK whenever a v* tag is pushed.
#
#   git tag v1.2 && git push origin v1.2
#
# The APK lands on the GitHub Release for that tag, from where it can be downloaded and
# installed directly on the phone. Signing secrets are described under "Releases" in the README.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # to create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Decode signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set; refusing to publish an unsigned release."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          # Monotonic across every workflow run, so each release can be tap-installed over
          # the previous one. Version name comes from the tag, minus its leading "v".
          RELEASE_VERSION_CODE: ${{ github.run_number }}
          RELEASE_VERSION_NAME: ${{ github.ref_name }}
        run: |
          export RELEASE_VERSION_NAME="${RELEASE_VERSION_NAME#v}"
          ./gradlew :app:assembleRelease
          mv app/build/outputs/apk/release/app-release.apk "aqiwidget-${RELEASE_VERSION_NAME}.apk"

      - name: Verify the APK is signed
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs aqiwidget-*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: aqiwidget-*.apk
          generate_release_notes: true
